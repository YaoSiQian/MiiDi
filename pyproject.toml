[project]
name = "miidi"
version = "0.1.0"
description = "LLM symbolic music generation with dual-track evaluation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "midiutil>=1.2", "httpx>=0.27"]

[project.scripts]
miidi = "miidi.cli:main"
miidi-dev = "miidi.web.app:run_dev"

[project.optional-dependencies]
dev = ["pytest>=8", "mido>=1.3", "pyyaml>=6.0", "ruff>=0.6"]
web = ["fastapi>=0.111", "uvicorn>=0.30", "httpx2>=2.0"]
evaltools = ["numpy", "scipy", "pandas", "PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["miidi"]
