[project]
name = "miidi"
version = "0.1.0"
description = "LLM symbolic music generation with dual-track evaluation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "midiutil>=1.2", "httpx>=0.27"]

[project.scripts]
miidi = "miidi.cli:main"
miidi-dev = "miidi.web.app:run_dev"
miidi-serve = "miidi.serve:main"

[project.optional-dependencies]
dev = ["pytest>=8", "mido>=1.3", "pyyaml>=6.0"]
web = ["fastapi>=0.111", "uvicorn>=0.30", "httpx2>=2.0"]
evaltools = ["numpy", "scipy", "pandas", "PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
